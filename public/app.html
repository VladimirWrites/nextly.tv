<!-- Both schemes, for the first paint: applyTheme() replaces these with a single value once
     the app has read the setting, but until it runs a lone dark value painted a dark status bar
     over a light app. The hexes are --ink in each scheme. -->
<meta name="theme-color" content="#f1f2f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="dark light">

     it is the account holder's business alone. The site at nextly.tv is the page to index. -->

<!-- iOS launch images.

     A home-screen web app with no startup image gets no launch screen at all, so iOS fills the
     gap by scaling whatever it last had into the standalone viewport. A snapshot taken in
     Safari, whose viewport is shorter, stretched to fit a taller window is why the app opened
     slightly zoomed with its right edge missing and then put itself right a moment later once
     the real render arrived.

     One per device resolution, because iOS matches them exactly and an image that does not
     match gets scaled, which is the same bug wearing a different hat. Portrait only.

     Both schemes, and the order is the point: the light set carries no colour-scheme query and
     is declared first, the dark set is qualified and declared after. A browser that understands
     prefers-color-scheme takes the later, more specific match; one that does not fails to match
     the qualified links at all and falls back to the first set. Either way every device matches
     something, and matching nothing is how the original bug returns.

     What this cannot follow is the theme set inside the app. iOS picks the image before any of
     our code runs, so the system preference is all it can read. Regenerate both sets with
     scripts/gen-splash.mjs. -->

<!-- Applied before first paint so a reload never flashes the wrong theme. The value is a
     mirror of settings.theme, kept in localStorage purely so it can be read synchronously. -->
<script>
  try {
    var t = localStorage.getItem("nx_theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
