# Must match the Workers Builds project name, or CI overrides it and warns on every deploy.
name = "nextly-tv"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Each uploaded version gets its own URL, so a branch can be looked at without being deployed.
#
# Preview URLs are served from the workers.dev subdomain and nowhere else — Cloudflare does not
# let them run on a custom domain — so workers_dev has to be on for them to exist at all. The
# cost of that is a second permanent address for production, nextly-tv.<subdomain>.workers.dev,
# serving this same Worker. Same code, same policy, same vault, and app.html is noindex, so it
# is an extra address rather than an extra surface. Accepted deliberately: reviewing a branch on
# a phone is worth more than one hostname's tidiness.
#
# The other half is in the dashboard: the non-production deploy command has to be
# `wrangler versions upload`, which publishes a version and routes nothing to it. `deploy` takes
# the routes below whatever branch it was built from, which is how an unmerged branch came to be
# production, and is what main alone should keep using.
workers_dev = true
preview_urls = true

# Both hostnames hit the same Worker; src/index.js decides which document to serve from the
# hostname. Declared here rather than clicked in the dashboard so a deploy re-creates them,
# and so it is obvious that "app." is a separate name needing its own DNS record — attaching
# the apex does not create the subdomain.
[[routes]]
pattern = "nextly.tv"
custom_domain = true

[[routes]]
pattern = "app.nextly.tv"
custom_domain = true

# Static site in ./public served via the assets binding. The Worker runs first so it can
# handle /api/* and route every other path to the right document.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# The id is an account-scoped identifier, not a secret, so it belongs in the repo.
# Re-create with `npm run db:create` if this database is ever deleted, then apply
# schema.sql with `npm run db:init`.
[[d1_databases]]
binding = "DB"
database_name = "nextly-db"
database_id = "826b65bb-93df-4811-a83a-fbaafcd52885"

# ---- previews ----
#
# A named environment, which is to say a second Worker: nextly-tv-preview. That is the whole
# point. A version uploaded against the configuration above carries a binding to the live vault
# database, so any code that ran as a preview — publicly reachable, since preview URLs are — held
# SELECT and DELETE over real rows. The blobs are ciphertext and stay unreadable, but enumerating
# account hashes and deleting rows is not nothing, and it needed no more than the ability to push
# a branch.
#
# This one binds a database of its own with the same schema and no data anyone owns. It declares
# no routes, so it cannot take nextly.tv or app.nextly.tv however it is deployed, and it answers
# on workers.dev alone.
#
# The empty routes list is the load-bearing line, and it is not obvious: routes ARE inherited by
# a named environment. Without it, `deploy --env preview` reassigns nextly.tv and app.nextly.tv
# to the preview Worker — the same fault this file has already been bitten by once, wearing a
# different hat. Wrangler warns about it on a dry run, which is how it was caught here.
#
# d1_databases and assets are the other way round: not inherited, so each is repeated. An
# environment that forgot the assets block would serve the API and no app; one that forgot the
# database would answer every vault request with an error.
[env.preview]
workers_dev = true
routes = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "nextly-db-preview"
database_id = "9201bb12-4ab4-47e7-865a-cde2b73f639e"

[env.preview.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
